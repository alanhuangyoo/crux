[project]
name = "crux"
version = "0.1.0"
description = "A terminal agent scaffold targeting Terminal-Bench, optimized for DeepSeek models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "harbor[modal]>=0.22.0",
    "jinja2>=3.1",
    "litellm>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crux"]

[tool.ruff]
line-length = 100
