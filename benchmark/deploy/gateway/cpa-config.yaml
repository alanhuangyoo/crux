# CLIProxyAPI -- speaks the Responses API natively, which is why it is in this
# path at all. new-api's Responses streaming is incomplete (upstream issue
# #6951, still open): it emits the item-level events but never response.created
# or response.completed, and Codex treats a stream with no terminal event as a
# dropped connection. CPA exists to serve Codex-shaped clients, so it emits the
# full lifecycle.
port: 8317

# Downstream auth: whoever calls 8317 presents this key.
api-keys:
  - "sk-cpa-6496521c207371b4c57294cceb47b7ad"

auth-dir: "/root/.cli-proxy-api"
logging-to-file: true
debug: false
request-retry: 3

# The local model, republished under the names Codex expects. Aliases are how a
# client that only knows OpenAI model names reaches a Qwen checkpoint without
# any client-side special casing.
openai-compatibility:
  - name: "local-sglang"
    base-url: "http://192.168.21.45:30080/v1"
    api-key-entries:
      - api-key: "sk-crux-iM-eVeNJmh1_crsLPfiBInwFaU410pNM"
    models:
      - name: "qwen3.8-27b"
        alias: "qwen3.8-27b"
      - name: "qwen3.8-27b"
        alias: "gpt-5.6-sol"
      - name: "qwen3.8-27b"
        alias: "gpt-5.6-terra"
      - name: "qwen3.8-27b"
        alias: "gpt-5.5"

# Vocabulary translation, which is a gateway's job and not the checkpoint's.
#
# OpenAI clients offer minimal/low/medium/high; Qwen3.5 accepts low/medium/xhigh
# and raises on anything else. low and medium happen to exist in both, so only
# the ends need mapping -- but the ends are exactly where the defaults sit:
# Codex ships with "high", so it fails on its very first request unless
# something translates.
#
# Conditional rather than a blanket override: a client that already asked for
# xhigh, medium, or low means it, and should not have that quietly rewritten.
payload:
  # high is dropped rather than rewritten. Rewriting it to "xhigh" does not
  # survive: CLIProxyAPI normalises effort back into OpenAI's own vocabulary on
  # the way to the upstream, so an injected "xhigh" arrives as "high" again and
  # the model rejects it -- visible in the error, which reports "high" even when
  # "xhigh" was what got sent. Removing the field instead lets the checkpoint's
  # own default apply, and that default is already xhigh
  # (reasoning_effort|default('xhigh')). Same destination, and it stays correct
  # if the default ever changes.
  filter:
    - models:
        - name: "*"
          match:
            - "reasoning.effort": "high"
      params:
        - "reasoning.effort"

  # The low end needs an actual value, not a deletion -- dropping it here would
  # land on the xhigh default, i.e. the opposite of what was asked for. "low"
  # exists in both vocabularies, so it survives normalisation intact.
  #
  # Conditional rather than blanket: a client that already asked for xhigh,
  # medium, or low means it, and should not have that quietly rewritten.
  override:
    - models:
        - name: "*"
          match:
            - "reasoning.effort": "minimal"
      params:
        "reasoning.effort": "low"
    - models:
        - name: "*"
          match:
            - "reasoning.effort": "none"
      params:
        "reasoning.effort": "low"
