# Public entry for the Crux model endpoint, replacing a plain socat forward.
#
# socat opens a fresh connection through the reverse tunnel for every client
# connection, and that tunnel crosses a 151ms link -- so every client paid a
# full extra round trip on its first request. Measured on this path: 375ms
# cold, 221ms once the connection was reused. nginx keeps the upstream side
# warm, so the client's first request lands on a connection that is already
# open and 221ms becomes the normal case rather than the best case.
upstream crux_engine {
    server 127.0.0.1:18078;
    # The pool is what removes the handshake. It has to be paired with
    # HTTP/1.1 and a cleared Connection header below, or nginx closes the
    # upstream connection after every response and the pool stays empty.
    keepalive 32;
    keepalive_timeout 300s;
    keepalive_requests 10000;
}

server {
    listen 18077;
    listen [::]:18077;
    server_name _;

    # Images and long transcripts; the engine itself accepts 512MB.
    client_max_body_size 512m;

    location / {
        proxy_pass http://crux_engine;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Streaming is the whole point of an LLM endpoint: with buffering on,
        # nginx accumulates the response and the client sees nothing until it
        # flushes, which destroys time-to-first-token even though the engine
        # emitted the first token immediately.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # A long reasoning turn can run for minutes before the last byte. The
        # default 60s read timeout would cut those off mid-stream.
        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
