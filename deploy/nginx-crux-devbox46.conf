# Public entry served from the GPU subnet itself.
#
# This box holds a public IP and sits on 192.168.21.0/24 alongside the engines
# -- 0.16ms from them -- so it needs no tunnel at all. That matters less for
# latency than it does for failure modes: the jump-box path depends on a
# reverse ssh tunnel that has to stay up, reconnect after NAT timeouts, and not
# lose a race for its own port. This path has none of those parts.
#
# It also needs no security-group change: port 80 is already reachable here,
# where a dedicated port is not.
#
# The nip.io hostname follows the convention already in use on this box
# (aura., r2wd., annotator.) so this server block cannot shadow the existing
# sites -- it only answers to its own name.
upstream crux_router {
    server 192.168.21.45:30080;
    # Keeps the upstream connection warm. Cheap here since the engine is on the
    # same subnet, but it still removes a handshake from every request.
    keepalive 16;
    keepalive_timeout 300s;
    keepalive_requests 10000;
}

server {
    listen 192.168.21.46:80;
    server_name crux.8.220.108.255.nip.io;

    client_max_body_size 512m;

    location / {
        proxy_pass http://crux_router;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Streaming is the point of the endpoint: with buffering on, nginx
        # holds the whole response and the client sees nothing until the last
        # token, which throws away the only latency number that matters.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
