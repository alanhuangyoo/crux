# Public entry served from the GPU subnet itself.
#
# This box holds a public IP and sits on 192.168.21.0/24 alongside the engines
# -- 0.16ms from them -- so it needs no tunnel at all. That matters less for
# latency than it does for failure modes: the jump-box path depends on a
# reverse ssh tunnel that has to stay up, reconnect after NAT timeouts, and not
# lose a race for its own port. This path has none of those parts.
#
# It also needs no security-group change: port 80 is already reachable here,
# where a dedicated port is not.
#
# The nip.io hostname follows the convention already in use on this box
# (aura., r2wd., annotator.) so this server block cannot shadow the existing
# sites -- it only answers to its own name.
upstream crux_router {
    server 192.168.21.45:30080;
    # Keeps the upstream connection warm. Cheap here since the engine is on the
    # same subnet, but it still removes a handshake from every request.
    keepalive 16;
    keepalive_timeout 300s;
    keepalive_requests 10000;
}

# The router validates /v1/responses against its own schema and rejects tool
# types it does not know -- Codex sends `type: "namespace"` to group its
# builtins, which is an OpenAI extension, and the router answers
# json_parse_error where the engines accept the same request and ignore the
# field. So that one route skips the router.
#
# Skipping it costs cache-aware routing, and nothing here can fully replace it.
# Affinity needs something that identifies a user, and behind a relay there is
# nothing: every request arrives from one source address bearing one shared API
# key, so hashing on $remote_addr or $http_authorization sends everyone to the
# same engine and leaves the other idle -- not an occasional collision but the
# guaranteed outcome.
#
# So balance on live queue depth instead. The prefix cache survives this better
# than it looks: RadixAttention keeps whatever each engine has seen, so after a
# couple of turns a user's transcript is resident on both, and from then on
# almost every turn hits a warm prefix regardless of where it lands. The price
# is one wasted re-prefill per user at the start, and each prefix stored twice
# -- against 1.85M tokens per engine, that still leaves room for roughly twenty
# concurrent full-length sessions each.
#
# If the relay can forward a per-user header, switch back to
# `hash $http_x_forwarded_for consistent` and this becomes true per-user
# affinity again.
upstream crux_engines_direct {
    least_conn;
    server 192.168.21.45:30000 max_fails=3 fail_timeout=30s;
    server 192.168.21.45:30001 max_fails=3 fail_timeout=30s;
    keepalive 16;
    keepalive_timeout 300s;
    keepalive_requests 10000;
}

server {
    listen 192.168.21.46:80;
    server_name crux.8.220.108.255.nip.io;

    client_max_body_size 512m;

    location /v1/responses {
        proxy_pass http://crux_engines_direct;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }

    location / {
        proxy_pass http://crux_router;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Streaming is the point of the endpoint: with buffering on, nginx
        # holds the whole response and the client sees nothing until the last
        # token, which throws away the only latency number that matters.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 15s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
    }
}
